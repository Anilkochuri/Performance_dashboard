
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7fbff; color: #222; }
    header { background: #e6f2ff; padding: 12px 16px; border-bottom: 1px solid #cfe4ff; }
    nav a { margin-right: 12px; text-decoration: none; color: #0645ad; }
    .container { max-width: 1040px; margin: 24px auto; padding: 0 16px; }
    .flash { padding: 8px 12px; border-radius: 6px; margin: 8px 0; }
    .flash.error { background: #ffe6e6; border: 1px solid #ffb3b3; }
    .flash.success { background: #e8ffe6; border: 1px solid #b3ffb3; }
    .flash.info { background: #e6f0ff; border: 1px solid #b3c6ff; }
  </style>
</head>
<body>
  <header>
    <nav>
      {% if session.logged_in %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('upload') }}">Upload XLSX</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      {% else %}
        <a href="{{ url_for('login') }}">Login</a>
      {% endif %}
    </nav>
  </header>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
