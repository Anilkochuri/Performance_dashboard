<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Performance Dashboard</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f8ff; color: #0f2a43; }
    header { background: #e6f0ff; border-bottom: 1px solid #cfe2ff; padding: 12px 16px; }
    h1 { margin: 0; font-size: 1.25rem; }
    .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; border: 1px solid #dde7f7; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab { padding: 8px 12px; border: 1px solid #cfe2ff; background: #f0f6ff; border-radius: 6px; cursor: pointer; }
    .tab.active { background: #dbeaff; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #e6eefb; padding: 8px; font-size: 0.9rem; }
    th { background: #f7fbff; }
    .hidden { display: none; }
  </style>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
  <header>
    <h1>Performance Dashboard — Read/Upload + Analyzer‑ready</h1>
  </header>
  <div class="container">
    <div class="card">
      <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
        <label>Upload CSV/XLSX (Transaction Summary): </label>
        <input type="file" name="file" accept=".csv,.xlsx" />
        <button type="submit">Upload & Analyze</button>
      </form>
      <div class="actions" style="margin-top:10px;">
        <button onclick="window.location.href='/download/analyzer_package'">Download Analyzer Package (XLSX+CSV)</button>
        <button onclick="window.location.href='/download/analyzer_xlsx'">Download Analyzer XLSX</button>
        <button onclick="window.location.href='/download/analyzer_csv'">Download Analyzer CSV</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" data-target="observations">Observations</div>
      <div class="tab" data-target="results">Results Table</div>
      <div class="tab" data-target="dbhits">DB_HITS</div>
      <div class="tab" data-target="graphs">Various Graphs</div>
    </div>
    <div id="observations" class="card">
      <p>Upload a file to populate data. If using the analyzer package, columns are already normalized.</p>
    </div>
    <div id="results" class="card hidden">
      <table id="resultsTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="dbhits" class="card hidden">
      <div id="dbhitsInfo">If your XLSX includes a DB_HITS sheet, it will appear here once uploaded.</div>
    </div>
    <div id="graphs" class="card hidden">
      <div id="chart1" style="height:320px;"></div>
      <div id="chart2" style="height:320px; margin-top:16px;"></div>
    </div>
  </div>
  <script>
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        document.getElementById(tab.dataset.target).classList.remove('hidden');
      });
    });
    fetch('/api/data').then(r => r.json()).then(payload => {
      if (!payload.ok) return; // no data yet
      const rows = payload.rows;
      const cols = payload.columns;
      const thead = document.querySelector('#resultsTable thead');
      const tbody = document.querySelector('#resultsTable tbody');
      thead.innerHTML = '<tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>';
      tbody.innerHTML = rows.map(r => '<tr>' + cols.map(c => `<td>${r[c] ?? ''}</td>`).join('') + '</tr>').join('');
      const tx = rows.map(r => r['Transaction']);
      const rt = rows.map(r => +r['response_time_seconds']);
      Plotly.newPlot('chart1', [{ type: 'bar', x: tx, y: rt, marker: { color: '#339af0' } }], { title: 'Response Time (s) by Transaction', yaxis: { range: [0, 10], dtick: 5 } });
      const bandCounts = {};
      rows.forEach(r => { const b = r['LatencyBand_calc'] || 'unknown'; bandCounts[b] = (bandCounts[b]||0)+1; });
      const labels = Object.keys(bandCounts);
      const values = labels.map(l => bandCounts[l]);
      Plotly.newPlot('chart2', [{type:'pie', labels, values}], { title: 'Latency Bands (Avg-based)' });
    }).catch(() => {});
  </script>
</body>
</html>
