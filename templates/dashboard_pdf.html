<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <script src="https://cdn.plot.ly/plotly-2.29.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    body { background: #f7fbff; }
    .navbar { background: #e6f2ff; }
    .card { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light mb-3">
    <div class="container-fluid">
      <span class="navbar-brand">Performance Dashboard (Read-only Snapshot)</span>
      <button id="downloadPdfBtn" class="btn btn-primary">Download Full Dashboard (PDF)</button>
    </div>
  </nav>

  <div id="dashboard-root" class="container">
    <!-- Simple upload form for convenience -->
    <form action="/" method="POST" enctype="multipart/form-data" class="mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-md-6">
          <label class="form-label">Upload CSV (JMeter or LoadRunner)</label>
          <input type="file" name="file" accept=".csv" class="form-control" required />
        </div>
        <div class="col-md-3">
          <label class="form-label">Units</label>
          <select name="unit_hint" class="form-select">
            <option value="auto" selected>Auto-detect</option>
            <option value="ms">Milliseconds (JMeter)</option>
            <option value="s">Seconds (LoadRunner)</option>
          </select>
        </div>
        <div class="col-md-3">
          <button class="btn btn-success w-100" type="submit">Upload & Visualize</button>
        </div>
      </div>
    </form>

    <!-- Tabs -->
    <ul class="nav nav-tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="tab-summary" data-bs-toggle="tab" data-bs-target="#pane-summary" type="button" role="tab">Summary</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-transactions" data-bs-toggle="tab" data-bs-target="#pane-transactions" type="button" role="tab">Transactions</button>
      </li>
    </ul>

    <div class="tab-content mt-3">
      <!-- Summary Pane -->
      <div class="tab-pane fade show active" id="pane-summary" role="tabpanel">
        <div class="card">
          <div class="card-header"><h3>Results Table</h3></div>
          <div class="card-body">
            {{ results_table_html | safe }}
          </div>
        </div>
      </div>

      <!-- Transactions Pane -->
      <div class="tab-pane fade" id="pane-transactions" role="tabpanel">
        <div class="card">
          <div class="card-header">
            <h3>Average & 90th Percentile Response Times (All Transactions)</h3>
            <small class="text-muted">Units shown in seconds; auto-handled for JMeter (ms) and LoadRunner (s).</small>
          </div>
          <div class="card-body">
            <div id="avg_p90_chart"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const transactionStats = {{ transaction_stats_json | safe }}; // { transactions, avg_rt_s, p90_rt_s }

    function renderAvgP90Chart(data) {
      const avgTrace = { x: data.transactions, y: data.avg_rt_s, name: 'Average RT (s)', type: 'bar', marker: { color: '#4e79a7' } };
      const p90Trace = { x: data.transactions, y: data.p90_rt_s, name: '90th Percentile RT (s)', type: 'bar', marker: { color: '#f28e2b' } };
      const layout = { barmode: 'group', xaxis: { title: 'Transaction Name', automargin: true }, yaxis: { title: 'Response Time (seconds)', rangemode: 'tozero', gridcolor: '#e0e0e0' }, legend: { orientation: 'h' }, margin: { t: 40, r: 20, b: 80, l: 60 }, height: 420 };
      Plotly.newPlot('avg_p90_chart', [avgTrace, p90Trace], layout, {responsive: true});
    }

    document.addEventListener('DOMContentLoaded', function () {
      if (transactionStats && (transactionStats.transactions || []).length) {
        renderAvgP90Chart(transactionStats);
      }
    });

    // PDF export of all tabs
    document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
      const { jsPDF } = window.jspdf; const pdf = new jsPDF('p', 'mm', 'a4');
      async function captureElementToPdfPage(el, addNewPage) {
        const canvas = await html2canvas(el, { scale: 2, useCORS: true, logging: false });
        const imgData = canvas.toDataURL('image/png');
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const ratio = Math.min(pageWidth / canvas.width, pageHeight / canvas.height);
        const finalWidth = canvas.width * ratio; const finalHeight = canvas.height * ratio;
        const x = (pageWidth - finalWidth) / 2; const y = 10; if (addNewPage) pdf.addPage();
        pdf.addImage(imgData, 'PNG', x, y, finalWidth, finalHeight);
      }
      const tabButtons = Array.from(document.querySelectorAll('.nav-tabs .nav-link'));
      const tabPanes = Array.from(document.querySelectorAll('.tab-content .tab-pane'));
      if (!tabButtons.length || !tabPanes.length) { const container = document.querySelector('#dashboard-root') || document.body; await captureElementToPdfPage(container, false); pdf.save('Performance_Dashboard.pdf'); return; }
      for (let i = 0; i < tabButtons.length; i++) { tabButtons[i].click(); await new Promise(res => setTimeout(res, 500)); await captureElementToPdfPage(tabPanes[i], i !== 0); }
      pdf.save('Performance_Dashboard.pdf');
    });
  </script>
</body>
</html>
