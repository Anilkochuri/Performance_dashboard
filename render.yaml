
services:
  - type: web
    name: performance-dashboard
    env: python
    plan: free
    autoDeploy: true
    region: oregon
    healthCheckPath: /login
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: FLASK_SECRET_KEY
        value: change-this-secret-key
      - key: DASH_USERNAME
        value: admin
      - key: DASH_PASSWORD
        value: password
      - key: TOP_N
        value: "10"
